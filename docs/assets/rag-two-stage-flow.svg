<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="100%" height="100%" fill="none">
  <defs>
    <marker id="ragArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60A5FA" />
    </marker>
  </defs>

  <rect width="1100" height="300" rx="16" fill="#0B0D11" />
  <rect x="1.5" y="1.5" width="1097" height="297" rx="14.5" stroke="#222631" stroke-width="2" />

  <text x="36" y="38" fill="#F3F4F6" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700">
    Two-Stage Agentic RAG Retrieval Workflow (data/exports/)
  </text>
  <text x="36" y="58" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="11">
    Designed for zero-context-bloat lookups across hundreds of ingested Discover &amp; Custom episodes
  </text>

  <!-- Step 1: User Prompt -->
  <rect x="36" y="82" width="230" height="182" rx="12" fill="#13161C" stroke="#222631" stroke-width="1.5" />
  <text x="52" y="108" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    STEP 1 · USER QUERY
  </text>
  <text x="52" y="132" fill="#F3F4F6" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">
    Semantic Follow-Up Prompt
  </text>
  <text x="52" y="156" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    &quot;In the article from my feed
  </text>
  <text x="52" y="172" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    earlier about the new
  </text>
  <text x="52" y="188" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    GoogleBook laptops, what
  </text>
  <text x="52" y="204" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    were the tested specs?&quot;
  </text>
  <text x="52" y="242" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10">
    POST /api/vault/rag-query
  </text>

  <line x1="266" y1="173" x2="298" y2="173" stroke="#60A5FA" stroke-width="2" marker-end="url(#ragArrow)" />

  <!-- Step 2: Stage 1 Lightweight Index Scan -->
  <rect x="302" y="82" width="252" height="182" rx="12" fill="#13161C" stroke="#60A5FA" stroke-width="1.5" />
  <text x="318" y="108" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    STAGE 1 · INDEX SCAN
  </text>
  <text x="318" y="132" fill="#F3F4F6" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">
    registry_index.json
  </text>
  <text x="318" y="154" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    • Scans lightweight metadata:
  </text>
  <text x="318" y="172" fill="#F3F4F6" font-family="'JetBrains Mono', monospace" font-size="10">
    title, keywords, summary, date
  </text>
  <text x="318" y="194" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    • Ranks top matching episodes
  </text>
  <text x="318" y="212" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    without loading full prose
  </text>
  <text x="318" y="242" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">
    Resolves -&gt; md_file path
  </text>

  <line x1="554" y1="173" x2="586" y2="173" stroke="#60A5FA" stroke-width="2" marker-end="url(#ragArrow)" />

  <!-- Step 3: Stage 2 Full Verbatim Ingestion -->
  <rect x="590" y="82" width="242" height="182" rx="12" fill="#13161C" stroke="#34D399" stroke-width="1.5" />
  <text x="606" y="108" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    STAGE 2 · SOURCE INGEST
  </text>
  <text x="606" y="132" fill="#F3F4F6" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">
    md/&lt;date&gt;_&lt;slug&gt;.md
  </text>
  <text x="606" y="154" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    • Loads 100% verbatim prose
  </text>
  <text x="606" y="172" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    + YAML frontmatter of only
  </text>
  <text x="606" y="190" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    the top 1–3 matched articles
  </text>
  <text x="606" y="212" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    • Includes extracted links
  </text>
  <text x="606" y="242" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10">
    Zero hallucination grounding
  </text>

  <line x1="832" y1="173" x2="864" y2="173" stroke="#60A5FA" stroke-width="2" marker-end="url(#ragArrow)" />

  <!-- Step 4: Grounded Answer -->
  <rect x="868" y="82" width="196" height="182" rx="12" fill="#13161C" stroke="#222631" stroke-width="1.5" />
  <text x="884" y="108" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
    OUTPUT · CITED ANSWER
  </text>
  <text x="884" y="132" fill="#F3F4F6" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">
    Fact-Grounded Response
  </text>
  <text x="884" y="156" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    Returns exact tested specs,
  </text>
  <text x="884" y="174" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    author quotes, and direct
  </text>
  <text x="884" y="192" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    citations to the captured
  </text>
  <text x="884" y="210" fill="#9CA3AF" font-family="'DM Sans', sans-serif" font-size="11">
    feed article.
  </text>
  <text x="884" y="242" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">
    Fresh &amp; Verifiable
  </text>
</svg>
